services:
  - type: web
    name: autonomous-ai-trader
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: TRADING_MODE
        value: PAPER
      - key: LIVE_TRADING_ENABLED
        value: "false"
      - key: EXCHANGE
        value: DELTA
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
