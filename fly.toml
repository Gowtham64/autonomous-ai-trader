# Fly.io Deployment Configuration — Autonomous AI Trading Terminal
# Docs: https://fly.io/docs/reference/configuration/

app = "autonomous-ai-trader"
primary_region = "sin" # Singapore (low latency to Delta / Asian markets)

[build]
  dockerfile = "Dockerfile"

[env]
  TRADING_MODE = "PAPER"
  LIVE_TRADING_ENABLED = "false"
  EXCHANGE = "DELTA"
  AUTH_REQUIRED = "false"
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  # CRITICAL FOR TRADING BOTS: Never stop machine when idle
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    hard_limit = 250
    soft_limit = 200

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "20s"
  method = "GET"
  path = "/health"

# Persistent Volume for SQLite database, trade ledgers & audit telemetry
[mounts]
  source = "trader_data"
  destination = "/app/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1024mb"
  cpus = 1
