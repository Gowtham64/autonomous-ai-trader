# fly.toml app configuration file generated for autonomous-trader-ollama on 2026-11-05T05:00:52+05:30
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'autonomous-trader-ollama'
primary_region = 'sin'

[build]
  image = 'ollama/ollama:latest'

[[mounts]]
  source = 'ollama_models'
  destination = '/root/.ollama'
  initial_size = '10gb'

[http_service]
  internal_port = 11434
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = 'shared-cpu-2x'
  memory = '4096mb'
  cpu_kind = 'shared'
  cpus = 2
  memory_mb = 4096
