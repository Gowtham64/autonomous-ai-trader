# Fly.io Configuration for Dedicated Ollama LLM Server
# Connects to autonomous-ai-trader via Fly.io Private Network (.internal)

app = "autonomous-trader-ollama"
primary_region = "sin" # Keep same region as trader app for 0ms network latency

[build]
  image = "ollama/ollama:latest"

[mounts]
  source = "ollama_models"
  destination = "/root/.ollama"
  initial_size = "10gb"

[http_service]
  internal_port = 11434
  force_https = false
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-2x"
  memory = "4096mb"
  cpus = 2
